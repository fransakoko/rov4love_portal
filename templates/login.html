{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="glass-panel border border-cyan-500/30 rounded-2xl w-full max-w-sm p-8 shadow-2xl shadow-cyan-900/50">
        <div class="text-center mb-6">
            <i class="fa-solid fa-water-submersible text-4xl text-cyan-400 mb-2"></i>
            <h2 class="text-2xl font-black text-white tracking-widest">ROV KOMUTA</h2>
            <p class="text-xs text-slate-400">Sistem Girişi</p>
        </div>
        
        <!-- Hata ve Uyarı Mesajları -->
        {% with messages = get_flashed_messages(category_filter=["error", "success"]) %}
            {% if messages %}
            <div class="bg-ocean-800/80 border border-cyan-500/50 text-cyan-300 p-2 rounded mb-4 text-xs text-center font-semibold">
                {{ messages[0] }}
            </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <input type="text" name="username" required placeholder="Kullanıcı Adı" class="w-full bg-ocean-900 border border-ocean-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-cyan-500 text-center">
            </div>
            <div>
                <input type="password" name="password" required placeholder="Şifre" class="w-full bg-ocean-900 border border-ocean-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-cyan-500 text-center">
            </div>
            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg shadow-lg shadow-cyan-500/20 transition mt-2">
                Bağlantı Kur
            </button>
        </form>
        
        <p class="text-center text-xs text-slate-500 mt-5">
            Yetkiniz yok mu? <br>
            <a href="{{ url_for('register') }}" class="text-cyan-400 font-bold hover:text-cyan-300">Gemiye Katıl (Kayıt Ol)</a>
        </p>
    </div>
</div>
{% endblock %}
